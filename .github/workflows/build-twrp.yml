name: Build TWRP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Cleanup
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 2048
          swap-size-mb: 8192
          remove-dotnet: true
          remove-android: true

      - name: Install dependencies
        run: |
          sudo apt update

          sudo apt install -y \
            git-core \
            gnupg \
            flex \
            bison \
            build-essential \
            zip \
            curl \
            zlib1g-dev \
            gcc-multilib \
            g++-multilib \
            libc6-dev-i386 \
            lib32ncurses5-dev \
            x11proto-core-dev \
            libx11-dev \
            lib32z1-dev \
            libgl1-mesa-dev \
            libxml2-utils \
            xsltproc \
            unzip \
            python3

      - name: Install repo
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Init source
        run: |
          mkdir twrp
          cd twrp

          repo init \
            --depth=1 \
            -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git \
            -b twrp-14.1

      - name: Sync source
        run: |
          cd twrp
          repo sync -j$(nproc --all) --force-sync

      - name: Clone device tree
        run: |
          cd twrp

          git clone \
            --depth=1 \
            -b fox_14.1 \
            https://github.com/AnandaAnugrahHandyanto/android_device_xiaomi_onyx-twrp.git \
            device/xiaomi/onyx

      - name: Build recovery
        run: |
          cd twrp

          export ALLOW_MISSING_DEPENDENCIES=true

          source build/envsetup.sh

          lunch twrp_onyx-eng

          mka recoveryimage -j$(nproc --all)

      - name: Upload recovery
        uses: actions/upload-artifact@v4
        with:
          name: twrp-onyx
          path: |
            twrp/out/target/product/onyx/*.img
